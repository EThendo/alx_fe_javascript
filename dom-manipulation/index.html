<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dynamic Quote Generator with Server Sync</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      text-align: center;
      padding: 40px;
      background: #f2f2f2;
    }
    #quoteDisplay {
      background: white;
      padding: 20px;
      margin: 20px auto;
      border-radius: 10px;
      max-width: 500px;
      box-shadow: 0 0 8px rgba(0, 0, 0, 0.2);
      font-size: 1.2rem;
    }
    button, select {
      background-color: #0d9c2c;
      color: white;
      border: none;
      padding: 10px 20px;
      border-radius: 5px;
      cursor: pointer;
      font-size: 1rem;
      margin: 5px;
    }
    button:hover, select:hover {
      background-color: #86851e;
    }
    input {
      padding: 8px;
      margin: 5px;
      border: 1px solid #ccc;
      border-radius: 4px;
    }
    #notification {
      margin-top: 20px;
      padding: 10px;
      display: none;
      border-radius: 6px;
      background: #fff3cd;
      border: 1px solid #ffeeba;
      color: #856404;
      max-width: 500px;
      margin-left: auto;
      margin-right: auto;
    }
  </style>
</head>
<body>
  <h1>Dynamic Quote Generator (with Server Sync)</h1>

  <!-- Category Filter -->
  <select id="categoryFilter" onchange="filterQuotes()">
    <option value="all">All Categories</option>
  </select>

  <!-- Display Quotes -->
  <div id="quoteDisplay">Click “Show New Quote” to see a quote</div>
  <button id="newQuote">Show New Quote</button>

  <!-- Add Quote -->
  <div style="margin-top: 30px;">
    <h3>Add Your Own Quote</h3>
    <input id="newQuoteText" type="text" placeholder="Enter a new quote" />
    <input id="newQuoteCategory" type="text" placeholder="Enter quote category" />
    <button id="addQuoteBtn">Add Quote</button>
  </div>

  <!-- Notification area --> 
  <div id="notification"></div>

  <script src="script.js"></script>
</body>
</html>
