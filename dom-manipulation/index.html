v<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Dynamic Quote Generator</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      text-align: center;
      padding: 40px;
      background: #f2f2f2;
    }

    #quoteDisplay {
      background: white;
      padding: 20px;
      margin: 20px auto;
      border-radius: 10px;
      max-width: 600px;
      box-shadow: 0 0 8px rgba(0,0,0,0.2);
      font-size: 1.2rem;
      min-height: 60px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    button {
      background-color: #295333;
      color: white;
      border: none;
      padding: 10px 20px;
      border-radius: 5px;
      cursor: pointer;
      font-size: 1rem;
      margin: 6px;
    }

    button:hover {
      background-color: #86851e;
    }

    input {
      padding: 8px;
      margin: 5px;
      border: 1px solid #ccc;
      border-radius: 4px;
    }

    #controls {
      margin-top: 20px;
    }

    #importExport {
      margin-top: 20px;
    }

    h3 {
      margin-top: 25px;
    }
  </style>
</head>
<body>
  <h1>Dynamic Quote Generator</h1>

  <!-- Quote Display -->
  <div id="quoteDisplay">Click “Show New Quote” to see a quote</div>

  <!-- Buttons -->
  <div id="controls">
    <button id="newQuote" onclick="showRandomQuote()">Show New Quote</button>
    <button id="showLast" onclick="showLastViewedQuote()">Show Last Viewed</button>
  </div>

  <!-- Add New Quote Form -->
  <div id="formContainer">
    <h3>Add Your Own Quote</h3>
    <input id="newQuoteText" type="text" placeholder="Enter a new quote" />
    <input id="newQuoteCategory" type="text" placeholder="Enter quote category" />
    <button id="addQuoteBtn" onclick="addQuote()">Add Quote</button>
  </div>

  <!-- Import / Export -->
  <div id="importExport">
    <input type="file" id="importFile" accept=".json" onchange="importFromJsonFile(event)" />
    <button id="exportBtn" onclick="exportToJsonFile()">Export JSON</button>
  </div>

  <script src="script.js"></script>
</body>
</html>
